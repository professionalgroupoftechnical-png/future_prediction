    --card:rgba(255,255,255,0.30);
    --card-border:rgba(255,255,255,0.55);

    --danger:#FFB4A6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{ font-family:'Inter', sans-serif; color:var(--ink); }

  .pager{ height:100vh; overflow-y:scroll; scroll-snap-type:y mandatory; }
  .section{
    min-height:100vh; scroll-snap-align:start; position:relative;
    display:flex; align-items:center; justify-content:center;
    padding:60px 5vw; overflow:hidden;
  }
  .section.scrollable{ align-items:flex-start; overflow-y:auto; }
  .bg{
    position:absolute; inset:0;
    background-image:
      linear-gradient(180deg, rgba(10,30,20,0.16) 0%, rgba(6,22,16,0.42) 100%),
      url('https://images.unsplash.com/photo-1687277459165-e642e4ca4e50?auto=format&fit=crop&w=1800&q=80');
    background-size:cover; background-position:center; background-attachment:fixed;
    z-index:-1;
  }
  .bg.bg2{
    background-image:
      linear-gradient(180deg, rgba(6,20,16,0.38) 0%, rgba(4,16,12,0.6) 100%),
      url('https://images.unsplash.com/photo-1744638629942-f6eb35d59b82?auto=format&fit=crop&w=1800&q=80');
  }

  .sound-toggle{
    position:fixed; top:16px; right:16px; z-index:5;
    display:flex; align-items:center; gap:7px;
    background:var(--card); border:0.5px solid var(--card-border);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    padding:8px 13px; border-radius:999px; font-size:12px; color:#fff; cursor:pointer;
  }
  .sound-dot{ width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,0.6); }
  .sound-toggle.on .sound-dot{ background:var(--gold); animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:0.5; } 50%{ opacity:1; } }

  .content{ width:100%; max-width:560px; color:#fff; }
  .content.wide{ max-width:1180px; }
  .eyebrow{ font-size:13px; color:var(--gold); margin:0 0 10px; font-weight:500; }
  h1{ font-family:'Fraunces', serif; font-weight:500; font-size:clamp(28px, 5vw, 44px); line-height:1.14; margin:0 0 12px; color:#fff; }
  h1 em{ font-style:italic; color:var(--gold); }
  .sub{ font-size:15px; color:rgba(255,255,255,0.85); max-width:56ch; line-height:1.6; margin:0 0 8px; }
  .note{ font-size:12px; color:rgba(255,255,255,0.62); margin:0 0 20px; line-height:1.5; }

  .card{
    background:var(--card); border:0.5px solid var(--card-border);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border-radius:20px; padding:26px;
  }
  label{ display:block; font-size:12.5px; color:rgba(255,255,255,0.75); margin-bottom:6px; }
  .field{ margin-bottom:14px; }
  input{
    width:100%; background:rgba(255,255,255,0.16); border:0.5px solid rgba(255,255,255,0.35);
    color:#fff; font-family:'Inter', sans-serif; font-size:15px;
    padding:12px 13px; border-radius:10px; outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;

  .error{ font-size:12.5px; color:var(--danger); margin:-6px 0 12px; }

    button.cta{ font-size:15px; padding:14px 16px; }
    .stats-row{

      margin-bottom:20px;

    .stat-badge{ margin-bottom:0; flex-shrink:0; }
    .stat-card > :not(.stat-badge){ align-self:flex-start; }
    .stat-caption{ max-width:none; }
    .stat-big{ font-size:24px; }
    .grid{ grid-template-columns:1fr; gap:12px; }
    .pred-card, .pred-card.big, .pred-card.small{
      grid-column:span 1;
      padding:18px 16px;
      border-radius:14px;
    }
    .pred-card.big .pred-title{ font-size:15px; }
    .pred-card.big .pred-text{ font-size:14px; }
    .pred-title{ font-size:14.5px; }
    .pred-text{ font-size:13.5px; line-height:1.7; }
    .footer-row{ margin-top:20px; gap:14px; }
    .disclaimer-card{ padding:16px 14px; gap:12px; border-radius:14px; }
    .disclaimer{ font-size:12.5px; line-height:1.65; }
    .again{ width:100%; padding:12px 16px; font-size:14px; }
    .hint{ bottom:12px; font-size:10px; }
    .result-head{ margin-bottom:14px; }

    h1{ font-size:clamp(24px, 8vw, 30px); }
    .sub{ font-size:13.5px; }

      max-width:11ch;

      text-overflow:ellipsis;

  }
</style>

const { useState, useRef, useEffect } = React;

function useAmbientSound() {
  const ctxRef = useRef(null);
  const [on, setOn] = useState(false);
  function start() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    ctxRef.current = ctx;
    const master = ctx.createGain();
    master.gain.value = 0.0;
    master.connect(ctx.destination);
    master.gain.linearRampToValueAtTime(0.15, ctx.currentTime + 2);
    const bufferSize = 2 * ctx.sampleRate;
    const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
    const noise = ctx.createBufferSource();
    noise.buffer = noiseBuffer; noise.loop = true;
    const noiseFilter = ctx.createBiquadFilter();
    noiseFilter.type = "lowpass"; noiseFilter.frequency.value = 650;
    const noiseGain = ctx.createGain(); noiseGain.gain.value = 0.5;
    noise.connect(noiseFilter).connect(noiseGain).connect(master);
    noise.start();
    [196, 261.6, 329.6].forEach((f, i) => {
      const osc = ctx.createOscillator(); osc.type = "sine"; osc.frequency.value = f;
      const g = ctx.createGain(); g.gain.value = 0.045;
      const lfo = ctx.createOscillator(); lfo.frequency.value = 0.08 + i * 0.02;
      const lfoGain = ctx.createGain(); lfoGain.gain.value = 0.025;
      lfo.connect(lfoGain).connect(g.gain); lfo.start();
      osc.connect(g).connect(master); osc.start();
    });
    setOn(true);
  }
  function stop() {
    const ctx = ctxRef.current;
    if (ctx) setTimeout(() => ctx.close(), 900);
    ctxRef.current = null; setOn(false);
  }
  useEffect(() => () => { if (ctxRef.current) ctxRef.current.close(); }, []);
  return { on, toggle: () => (on ? stop() : start()) };
}

function getZodiac(dob) {
  const [y, m, d] = dob.split("-").map(Number);
  for (const z of ZODIAC) {
    const [fm, fd] = z.from, [tm, td] = z.to;

function getLuckyNumber(name, dob) {
  const str = (name + dob).toLowerCase().replace(/[^a-z0-9]/g, "");

function App() {
  const [name, setName] = useState("");
  const [dob, setDob] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const sound = useAmbientSound();
  const pagerRef = useRef(null);
  const section2Ref = useRef(null);

  function handleSubmit() {
    if (!name.trim() || !dob) {
      setError("Naam aur date of birth dono zaroori hain.");
      return;
    }
    setError(""); setLoading(true);
    setTimeout(() => {
      const zodiac = getZodiac(dob);
      const lp = getLifePath(dob);
      const lucky = getLuckyNumber(name.trim(), dob);
      const texts = buildPredictions(zodiac, lp);
      const titleMap = {
        career:"Career aur Job", shaadi:"Shaadi", partner:"Life Partner Kaisa Ho Sakta Hai",
        health:"Sehat", paisa:"Paisa, Ghar aur Investment", safar:"Foreign aur Safar",
        log:"Rishtay, Dost aur Log", mushkil:"Mushkilat aur Zindagi"
      };
      const preds = Object.keys(titleMap).map((k) => ({ key: k, title: titleMap[k], text: texts[k] }));
      setLoading(false); setResult({ zodiac, lp, lucky, preds });
      setTimeout(() => { if (section2Ref.current) section2Ref.current.scrollIntoView({ behavior: "smooth" }); }, 100);
    }, 1200);
  }
  function reset() {
    setResult(null); setError("");
    if (pagerRef.current) pagerRef.current.scrollTo({ top: 0, behavior: "smooth" });
  }

  return (
    <div className="pager" ref={pagerRef}>
      <div className={"sound-toggle" + (sound.on ? " on" : "")} onClick={sound.toggle}>
        <span className="sound-dot"></span>
        <span>{sound.on ? "Awaaz chal rahi hai" : "Sukoon wali awaaz"}</span>
      </div>

      <section className="section">
        <div className="bg"></div>
        <div className="content">
          <p className="eyebrow">Falak</p>
          <h1>Apna <em>future</em> jano,<br/>chand sitaron ki zubani.</h1>
          <p className="sub">Naam aur date of birth dalein — career, shaadi, sehat, paisa, ghar, foreign aur zindagi ke baare mein detailed likha hua jawab payein.</p>
          <p className="note">Sirf tafreeh ke liye — asli faisle experts aur family se mashwara kar ke lein.</p>

            <div className="field">
              <label htmlFor="name">Apna naam</label>
              <input id="name" type="text" placeholder="Naam likhein" value={name} onChange={(e) => setName(e.target.value)} />

            <div className="field">
              <label htmlFor="dob">Date of birth</label>
              <input id="dob" type="date" value={dob} onChange={(e) => setDob(e.target.value)} />
            </div>
            {error && <p className="error">{error}</p>}
            <button className="cta" onClick={handleSubmit} disabled={loading}>
              {loading ? "Sitare dekh rahe hain..." : "Future dekhein"}
            </button>
            {loading && (
              <div className="loading">
                <span className="leaf-spin"></span>
                <span>Calculate kar rahe hain...</span>
              </div>
            )}
          </div>
        </div>
        {result && <div className="hint">Neeche scroll karein ↓</div>}
      </section>

      <section className="section scrollable" ref={section2Ref}>
        <div className="bg bg2"></div>
        <div className="diamond" style={{width:90, height:90, top:"8%", right:"6%", transform:"rotate(15deg)"}}></div>

              </div>

                <div className="stat-badge"><span>◆</span></div>
